name: Compile releases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact_name: target/release/legion-kb-rgb
            asset_name: legion-kb-rgb-linux
            triplet: x64-linux
            vcpkgCommitId: '5d4a3dc90c0b3773f3bac81bf41297b54328f471'
          - name: windows
            os: windows-latest
            artifact_name: target/release/legion-kb-rgb.exe
            asset_name: legion-kb-rgb-windows
            triplet: x64-windows-static
            vcpkgCommitId: '5d4a3dc90c0b3773f3bac81bf41297b54328f471'

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg/installed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "${{ runner.os }}-cargo"

      - name: Download dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
           sudo apt-get update -y
           sudo apt install -y libunwind-dev
           sudo apt-get install -y libx11-dev nasm libasound2-dev libdbus-1-dev libudev-dev libxcb-randr0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libxi-dev libxtst-dev libusb-1.0-0-dev libpango1.0-dev libgtk-3-dev libxdo-dev libappindicator3-dev
          elif [ "$RUNNER_OS" == "macOS" ]; then
           brew install nasm
          elif [ "$RUNNER_OS" == "Windows" ]; then
           echo "Nothing to do."
          fi
        shell: bash

      - name: Set up VCPKG deps
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgGitCommitId: '${{ matrix.vcpkgCommitId }}'
          # Run vcpkg with the command specified by the `runVcpkgFormatString` input.
          runVcpkgInstall: true
          vcpkgJsonGlob: '**/vcpkg.json'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      # - name: Prints output of run-vcpkg's action.
      #   run: echo "root='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}', triplet='${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_DEFAULT_TRIPLET_OUT }}' "

      # - name: Set VCPKG_ROOT
      #   run: echo "VCPKG_ROOT=$(echo $VCPKG_INSTALLATION_ROOT)" >> $GITHUB_ENV
      #   shell: bash

      - name: Patch webm-sys for newer GCC (missing cstdint)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # webm-sys uses uint32_t/uint64_t without including <cstdint>,
          # which fails on newer GCC. Inject the include via CXXFLAGS.
          echo "CXXFLAGS=-include cstdint" >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: cargo build --release --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifact_name }}
